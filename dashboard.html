<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <div id="login-section">
    <div class="login-box">
      <h2>CEO Dashboard</h2>
      <p style="color:#666; margin-bottom:20px;">Collins Clothing</p>
      
      <input type="password" id="pass" placeholder="Password" style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; font-size:16px;">
      
      <button id="loginBtn" style="width:100%; padding:14px; background:#000; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600;">
        Login
      </button>
      
      <p style="margin-top:15px; font-size:13px; color:#888;">Password is: <b>collins2026</b></p>
      <p style="margin-top:10px;"><a href="index.html" style="color:#e11d48;">← Back to Shop</a></p>
    </div>
  </div>

  <div id="dash-section" style="display:none; padding:20px;">
    <h2>Welcome Boss</h2>
    <p>You are logged in successfully.</p>
    <button onclick="location.reload()" style="padding:10px 20px; background:#ef4444; color:white; border:none; border-radius:6px;">Logout</button>
    <br><br>
    <a href="index.html">Go to Shop</a>
  </div>

  <script>
    // Simple login that cannot fail
    document.getElementById('loginBtn').onclick = function() {
      var password = document.getElementById('pass').value;
      
      if (password === 'collins2026') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dash-section').style.display = 'block';
      } else {
        alert('Wrong password. Type: collins2026');
      }
    };

    // Also allow Enter key
    document.getElementById('pass').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginBtn').click();
      }
    });
  </script>
</body>
</html>
