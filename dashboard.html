<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#f1f5f9; }
    .login-box {
      max-width:380px; margin:80px auto; background:white;
      padding:30px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08);
      text-align:center;
    }
    .login-box input {
      width:100%; padding:14px; margin:8px 0; border:1px solid #ddd;
      border-radius:8px; font-size:16px; box-sizing:border-box;
    }
    .login-box button {
      width:100%; padding:14px; background:#111; color:white;
      border:none; border-radius:8px; font-size:16px; font-weight:600; margin-top:10px;
    }
    #message { margin-top:15px; color:#dc2626; font-size:14px; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>CEO Login</h2>
    <p style="color:#666;margin-bottom:20px;">Collins Clothing Admin</p>

    <input type="email" id="email" placeholder="Admin email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="doLogin()">Login</button>

    <p id="message"></p>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Check if config is loaded
    if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_ANON_KEY === "undefined") {
      document.getElementById("message").textContent = "Error: supabase-config.js is not loaded correctly";
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      msg.style.color = "#dc2626";
      msg.textContent = "Trying to login...";

      if (!email || !password) {
        msg.textContent = "Please enter email and password";
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          msg.textContent = "Error: " + error.message;
          return;
        }

        // Success
        msg.style.color = "green";
        msg.textContent = "Login successful! Redirecting...";
        
        // Go to the full dashboard (we will add it next)
        setTimeout(function() {
          window.location.href = "dashboard.html?loggedin=1";
        }, 1000);

      } catch (err) {
        msg.textContent = "Unexpected error: " + err.message;
      }
    }

    // Enter key
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
