<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard | Collins Clothing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <!-- Login -->
  <div id="login-section">
    <div class="login-box">
      <h2 style="margin-bottom:8px;">CEO Dashboard</h2>
      <p style="color:#666;font-size:0.9rem;margin-bottom:20px;">Collins Clothing Admin</p>
      <input type="password" id="password" placeholder="Enter password" onkeypress="if(event.key==='Enter') doLogin()">
      <button onclick="doLogin()">Login</button>
      <p style="margin-top:16px;font-size:0.8rem;color:#999;">Password: collins2026</p>
      <p style="margin-top:8px;"><a href="index.html" style="color:#e11d48;font-size:0.9rem;">← Back to Shop</a></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dash-section" style="display:none;">
    <header class="dash-header">
      <div><strong>Collins Clothing</strong> — CEO Panel</div>
      <div style="display:flex;gap:16px;align-items:center;">
        <a href="index.html" style="color:#94a3b8;font-size:0.9rem;">View Shop</a>
        <button onclick="doLogout()" style="background:#ef4444;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;">Logout</button>
      </div>
    </header>

    <div class="dash-container">
      <div class="stats-grid">
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label">Total Products</div></div>
        <div class="stat-box"><div class="num" id="stat-available">0</div><div class="label">Available</div></div>
        <div class="stat-box"><div class="num" id="stat-sold">0</div><div class="label">Sold Out</div></div>
        <div class="stat-box"><div class="num" id="stat-orders">0</div><div class="label">Orders</div></div>
      </div>

      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2>Customer Orders</h2>
          <button onclick="clearOrders()" style="padding:8px 14px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-size:0.85rem;">Clear All</button>
        </div>
        <div id="orders-list" class="orders-list"></div>
      </div>

      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2>Manage Products</h2>
          <button onclick="resetToDefault()" style="padding:8px 14px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-size:0.85rem;">Reset to Default</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="product-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Price (₦)</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="dashboard.js"></script>

  <script>
    // Strong login that works even if other scripts have issues
    function doLogin() {
      const pass = document.getElementById('password').value;
      if (pass === 'collins2026') {
        sessionStorage.setItem('collins_ceo', 'true');
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dash-section').style.display = 'block';
        if (typeof renderDashboard === 'function') renderDashboard();
        if (typeof renderOrders === 'function') renderOrders();
      } else {
        alert('Wrong password. Try again.\nPassword is: collins2026');
      }
    }

    function doLogout() {
      sessionStorage.removeItem('collins_ceo');
      location.reload();
    }

    // Auto login if already logged in
    if (sessionStorage.getItem('collins_ceo') === 'true') {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dash-section').style.display = 'block';
      setTimeout(function() {
        if (typeof renderDashboard === 'function') renderDashboard();
        if (typeof renderOrders === 'function') renderOrders();
      }, 300);
    }
  </script>
</body>
  </html>
