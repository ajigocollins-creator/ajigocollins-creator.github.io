<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CEO Dashboard - Collins Clothing</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #111;
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #d8d8d8;
      border-radius: 14px;
      margin-bottom: 13px;
      outline: none;
      background: white;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    #login-box {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f6fa;
    }

    .login-card {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 65px 58px;
      border-radius: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .login-card h1 {
      text-align: center;
      margin: 0 0 12px;
      font-size: 48px;
      color: #111;
    }

    .login-card p {
      text-align: center;
      color: #666;
      font-size: 28px;
      margin: 0 0 55px;
    }

    .login-card input {
      height: 70px;
      font-size: 21px;
      padding: 0 28px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      height: 70px;
      background: #111;
      color: white;
      border-radius: 15px;
      font-size: 22px;
      margin-top: 12px;
    }

    .login-btn:hover {
      background: #222;
    }

    #login-message,
    #product-message,
    #action-message {
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
      min-height: 20px;
    }

    /* =====================================================
       DASHBOARD HEADER
    ===================================================== */

    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    .logout-btn {
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px;
    }

    /* =====================================================
       STATS
    ===================================================== */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .stat small {
      color: #666;
      font-size: 14px;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      margin-top: 8px;
    }

    /* =====================================================
       SECTIONS
    ===================================================== */

    .section {
      background: white;
      border-radius: 20px;
      padding: 23px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .section h2 {
      margin-top: 0;
      font-size: 25px;
    }

    /* =====================================================
       ADD PRODUCT
    ===================================================== */

    .category-label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .preview {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #ddd;
      display: none;
      margin-bottom: 13px;
    }

    .add-btn {
      background: #111;
      color: white;
      padding: 14px 20px;
      border-radius: 11px;
    }

    /* =====================================================
       PRODUCTS TOOLBAR
    ===================================================== */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .refresh-btn {
      background: #111;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
    }

    /* =====================================================
       PRODUCT FILTERS
    ===================================================== */

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn {
      background: white;
      color: #111;
      border: 1px solid #ddd;
      border-radius: 50px;
      padding: 13px 24px;
      font-size: 16px;
    }

    .filter-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* =====================================================
       PRODUCTS
    ===================================================== */

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .product-card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      padding: 15px;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      border-radius: 13px;
      background: #eee;
      margin-bottom: 14px;
      display: block;
    }

    .product-category {
      display: inline-block;
      background: #111;
      color: white;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .product-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .product-buttons button {
      padding: 10px 12px;
      border-radius: 9px;
    }

    .save-btn {
      background: #111;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .status-available {
      background: #16a34a;
      color: white;
    }

    .status-sold {
      background: #64748b;
      color: white;
    }

    /* =====================================================
       ORDERS
    ===================================================== */

    .order-card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .order-card p {
      margin: 7px 0;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 25px;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-list {
        grid-template-columns: 1fr;
      }

      .login-card {
        max-width: 100%;
        padding: 55px 35px;
      }

      .login-card h1 {
        font-size: 40px;
      }

      .login-card p {
        font-size: 24px;
        margin-bottom: 40px;
      }
    }

    @media (max-width: 500px) {

      #login-box {
        padding: 0;
      }

      .login-card {
        min-height: 100vh;
        border-radius: 0 0 30px 30px;
        padding: 100px 28px 45px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .login-card h1 {
        font-size: 38px;
      }

      .login-card p {
        font-size: 23px;
      }

      .login-card input {
        height: 65px;
        font-size: 18px;
      }

      .login-btn {
        height: 65px;
      }

      .container {
        padding: 12px;
      }

      .section {
        padding: 17px;
      }

      .stats {
        gap: 10px;
      }

      .stat {
        padding: 15px;
      }

      .stat strong {
        font-size: 24px;
      }

      .filters {
        gap: 8px;
      }

      .filter-btn {
        padding: 11px 15px;
        font-size: 14px;
      }

      .product-card img {
        height: 300px;
      }

      header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login-box">

  <div class="login-card">

    <h1>CEO Login</h1>

    <p>Collins Clothing Admin</p>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      type="password"
      id="pass"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      Login
    </button>

    <div id="login-message"></div>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="app" class="hidden">

  <header>

    <h1>Collins Clothing — CEO Dashboard 👑</h1>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </header>

  <main class="container">

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <small>Total Products</small>
        <strong id="t">0</strong>
      </div>

      <div class="stat">
        <small>Available</small>
        <strong id="a">0</strong>
      </div>

      <div class="stat">
        <small>Sold Out</small>
        <strong id="s">0</strong>
      </div>

      <div class="stat">
        <small>Orders</small>
        <strong id="o">0</strong>
      </div>

    </div>


    <!-- =================================================
         ADD PRODUCT
    ================================================= -->

    <section class="section">

      <h2>➕ Add New Product</h2>

      <input
        type="text"
        id="nname"
        placeholder="Product name"
      >

      <input
        type="number"
        id="nprice"
        placeholder="Price in ₦"
        min="0"
      >

      <label class="category-label">
        Product Category
      </label>

      <select id="ncategory">

        <option value="T-Shirt">
          T-Shirt
        </option>

        <option value="Baggie Jeans">
          Baggie Jeans
        </option>

        <option value="Hoodies">
          Hoodies
        </option>

      </select>

      <input
        type="file"
        id="img"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="prev"
        class="preview"
        alt="Preview"
      >

      <button
        class="add-btn"
        id="addBtn"
        onclick="addProduct()"
      >
        Add Product
      </button>

      <div id="product-message"></div>

    </section>


    <!-- =================================================
         MANAGE PRODUCTS
    ================================================= -->

    <section class="section">

      <div class="toolbar">

        <h2>All Products</h2>

        <button
          class="refresh-btn"
          onclick="loadProducts()"
        >
          🔄 Refresh
        </button>

      </div>


      <!-- FILTERS -->

      <div class="filters">

        <button
          class="filter-btn active"
          id="filter-all"
          onclick="setFilter('all')"
        >
          All
        </button>

        <button
          class="filter-btn"
          id="filter-tshirt"
          onclick="setFilter('T-Shirt')"
        >
          T-Shirts
        </button>

        <button
          class="filter-btn"
          id="filter-jeans"
          onclick="setFilter('Baggie Jeans')"
        >
          Baggie Jeans
        </button>

        <button
          class="filter-btn"
          id="filter-hoodies"
          onclick="setFilter('Hoodies')"
        >
          Hoodies
        </button>

        <button
          class="filter-btn"
          id="filter-stock"
          onclick="setFilter('stock')"
        >
          In Stock
        </button>

        <button
          class="filter-btn"
          id="filter-sold"
          onclick="setFilter('sold')"
        >
          Sold Out
        </button>

      </div>

      <div id="action-message"></div>

      <div
        id="plist"
        class="product-list"
      >

        <p class="empty">
          Login to load products...
        </p>

      </div>

    </section>


    <!-- =================================================
         ORDERS
    ================================================= -->

    <section class="section">

      <div class="toolbar">

        <h2>📦 Orders</h2>

        <button
          class="refresh-btn"
          onclick="loadOrders()"
        >
          🔄 Refresh Orders
        </button>

      </div>

      <div id="orders">

        <p class="empty">
          Login to load orders...
        </p>

      </div>

    </section>

  </main>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

if (
  typeof SUPABASE_URL === "undefined" ||
  typeof SUPABASE_ANON_KEY === "undefined"
) {

  document.getElementById("login-message").textContent =
    "Supabase configuration was not loaded.";

  throw new Error(
    "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
  );
}

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBAL FILTER
===================================================== */

let currentFilter = "all";
let allProducts = [];


/* =====================================================
   HELPERS
===================================================== */

function showMessage(
  elementId,
  message,
  success = false
) {

  const element =
    document.getElementById(elementId);

  if (!element) return;

  element.textContent = message;

  element.style.color =
    success ? "#16a34a" : "#dc2626";
}


function formatMoney(value) {

  return "₦" +
    Number(value || 0)
      .toLocaleString("en-NG");
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("pass")
      .value;

  if (!email || !password) {

    showMessage(
      "login-message",
      "Please enter your email and password."
    );

    return;
  }

  const button =
    document.getElementById("loginBtn");

  button.disabled = true;
  button.textContent = "Logging in...";

  showMessage(
    "login-message",
    "Checking login..."
  );

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if (error) {

      console.error(error);

      showMessage(
        "login-message",
        error.message
      );

      return;
    }

    if (!data || !data.user) {

      showMessage(
        "login-message",
        "Login failed. Please try again."
      );

      return;
    }

    document
      .getElementById("login-box")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    showMessage(
      "login-message",
      ""
    );

    await loadDashboard();

  } catch (error) {

    console.error(error);

    showMessage(
      "login-message",
      "Login error: " +
      error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "Login";
  }
}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();

    if (error) {

      console.error(error);
      return;
    }

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      document
        .getElementById("login-box")
        .classList.add("hidden");

      document
        .getElementById("app")
        .classList.remove("hidden");

      await loadDashboard();
    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );
  }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  try {

    await supabaseClient.auth.signOut();

  } catch (error) {

    console.error(error);
  }

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("login-box")
    .classList.remove("hidden");

  document.getElementById("pass").value = "";

  document.getElementById("plist").innerHTML =
    '<p class="empty">Login to load products...</p>';

  document.getElementById("orders").innerHTML =
    '<p class="empty">Login to load orders...</p>';
}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  await loadProducts();

  await loadOrders();
}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const container =
    document.getElementById("plist");

  container.innerHTML =
    '<p class="empty">Loading products...</p>';

  try {

    const {
      data: products,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      container.innerHTML =
        `<p class="empty">
          Unable to load products.<br><br>
          ${escapeHTML(error.message)}
        </p>`;

      return;
    }

    allProducts =
      products || [];

    updateProductStats(allProducts);

    renderProducts();

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<p class="empty">
        Unable to load products.<br><br>
        ${escapeHTML(error.message)}
      </p>`;
  }
}


/* =====================================================
   PRODUCT STATS
===================================================== */

function updateProductStats(products) {

  const total =
    products.length;

  const available =
    products.filter(
      product =>
        product.available !== false
    ).length;

  const sold =
    total - available;

  document.getElementById("t")
    .textContent = total;

  document.getElementById("a")
    .textContent = available;

  document.getElementById("s")
    .textContent = sold;
}


/* =====================================================
   SET FILTER
===================================================== */

function setFilter(filter) {

  currentFilter = filter;

  document
    .querySelectorAll(".filter-btn")
    .forEach(button => {
      button.classList.remove("active");
    });

  if (filter === "all") {
    document.getElementById("filter-all")
      .classList.add("active");
  }

  if (filter === "T-Shirt") {
    document.getElementById("filter-tshirt")
      .classList.add("active");
  }

  if (filter === "Baggie Jeans") {
    document.getElementById("filter-jeans")
      .classList.add("active");
  }

  if (filter === "Hoodies") {
    document.getElementById("filter-hoodies")
      .classList.add("active");
  }

  if (filter === "stock") {
    document.getElementById("filter-stock")
      .classList.add("active");
  }

  if (filter === "sold") {
    document.getElementById("filter-sold")
      .classList.add("active");
  }

  renderProducts();
}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

  const container =
    document.getElementById("plist");

  let products =
    [...allProducts];


  /* FILTER */

  if (currentFilter === "T-Shirt") {

    products =
      products.filter(
        product =>
          (product.category || "T-Shirt")
          === "T-Shirt"
      );
  }

  if (currentFilter === "Baggie Jeans") {

    products =
      products.filter(
        product =>
          product.category === "Baggie Jeans"
      );
  }

  if (currentFilter === "Hoodies") {

    products =
      products.filter(
        product =>
          product.category === "Hoodies"
      );
  }

  if (currentFilter === "stock") {

    products =
      products.filter(
        product =>
          product.available !== false
      );
  }

  if (currentFilter === "sold") {

    products =
      products.filter(
        product =>
          product.available === false
      );
  }


  if (!products.length) {

    container.innerHTML =
      '<p class="empty">No products found in this category.</p>';

    return;
  }


  container.innerHTML =
    products.map(product => {

      const id =
        JSON.stringify(product.id);

      const safeId =
        escapeHTML(product.id);

      const name =
        escapeHTML(
          product.name || ""
        );

      const price =
        Number(product.price) || 0;

      /*
        IMPORTANT:
        Supabase uses image_url.
      */

      const image =
        product.image_url ||
        product.image ||
        "logo.png";

      const safeImage =
        escapeHTML(image);

      const available =
        product.available !== false;

      const category =
        product.category ||
        "T-Shirt";

      return `

        <div
          class="product-card"
          id="product-${safeId}"
        >

          <img
            src="${safeImage}"
            alt="${name}"
            onerror="this.style.display='none'"
          >

          <span class="product-category">
            ${escapeHTML(category)}
          </span>

          <input
            type="text"
            id="name-${safeId}"
            value="${name}"
            placeholder="Product name"
          >

          <input
            type="number"
            id="price-${safeId}"
            value="${price}"
            min="0"
            placeholder="Price"
          >

          <select
            id="category-${safeId}"
          >

            <option
              value="T-Shirt"
              ${category === "T-Shirt" ? "selected" : ""}
            >
              T-Shirt
            </option>

            <option
              value="Baggie Jeans"
              ${category === "Baggie Jeans" ? "selected" : ""}
            >
              Baggie Jeans
            </option>

            <option
              value="Hoodies"
              ${category === "Hoodies" ? "selected" : ""}
            >
              Hoodies
            </option>

          </select>

          <div class="product-buttons">

            <button
              class="${
                available
                  ? "status-available"
                  : "status-sold"
              }"
              onclick="toggleProduct(${id}, ${available})"
            >
              ${
                available
                  ? "Available ✅"
                  : "Sold Out ❌"
              }
            </button>

            <button
              class="save-btn"
              onclick="saveProduct(${id})"
            >
              Save 💾
            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct(${id})"
            >
              Delete 🗑️
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =====================================================
   PREVIEW IMAGE
===================================================== */

function previewImage() {

  const input =
    document.getElementById("img");

  const preview =
    document.getElementById("prev");

  const file =
    input.files[0];

  if (!file) {

    preview.src = "";
    preview.style.display = "none";

    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";
}


/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct() {

  const name =
    document.getElementById("nname")
      .value
      .trim();

  const price =
    Number(
      document.getElementById("nprice").value
    );

  const category =
    document.getElementById("ncategory")
      .value;

  const file =
    document.getElementById("img")
      .files[0];

  const addButton =
    document.getElementById("addBtn");

  if (!name) {

    showMessage(
      "product-message",
      "Please enter the product name."
    );

    return;
  }

  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    showMessage(
      "product-message",
      "Please enter a valid price."
    );

    return;
  }

  if (!file) {

    showMessage(
      "product-message",
      "Please choose a product image."
    );

    return;
  }

  addButton.disabled = true;

  showMessage(
    "product-message",
    "Uploading product..."
  );

  try {

    /* FILE EXTENSION */

    const extension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "jpg";


    /* UNIQUE FILE NAME */

    const fileName =
      `${Date.now()}-${Math.random()
        .toString(36)
        .substring(2)}.${extension}`;


    /* UPLOAD IMAGE */

    const {
      error: uploadError
    } =
      await supabaseClient.storage
        .from("product-images")
        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );

    if (uploadError) {

      console.error(uploadError);

      showMessage(
        "product-message",
        "Image upload failed: " +
        uploadError.message
      );

      return;
    }


    /* PUBLIC IMAGE URL */

    const {
      data: publicData
    } =
      supabaseClient.storage
        .from("product-images")
        .getPublicUrl(fileName);

    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      showMessage(
        "product-message",
        "Could not create image URL."
      );

      return;
    }

    const imageUrl =
      publicData.publicUrl;


    /* INSERT PRODUCT */

    const {
      error: insertError
    } =
      await supabaseClient
        .from("products")
        .insert({

          name: name,

          price: price,

          category: category,

          image_url: imageUrl,

          available: true

        });

    if (insertError) {

      console.error(insertError);

      showMessage(
        "product-message",
        "Product database error: " +
        insertError.message
      );

      return;
    }


    /* RESET */

    document.getElementById("nname")
      .value = "";

    document.getElementById("nprice")
      .value = "";

    document.getElementById("ncategory")
      .value = "T-Shirt";

    document.getElementById("img")
      .value = "";

    const preview =
      document.getElementById("prev");

    preview.src = "";

    preview.style.display =
      "none";


    showMessage(
      "product-message",
      "Product added successfully! 🎉",
      true
    );

    await loadProducts();

  } catch (error) {

    console.error(error);

    showMessage(
      "product-message",
      "Something went wrong: " +
      error.message
    );

  } finally {

    addButton.disabled = false;
  }
}


/* =====================================================
   TOGGLE AVAILABLE / SOLD
===================================================== */

async function toggleProduct(
  id,
  currentStatus
) {

  showMessage(
    "action-message",
    "Updating product..."
  );

  try {

    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({
          available: !currentStatus
        })
        .eq("id", id);

    if (error) {

      console.error(error);

      showMessage(
        "action-message",
        "Unable to change status: " +
        error.message
      );

      return;
    }

    showMessage(
      "action-message",
      "Product status updated successfully.",
      true
    );

    await loadProducts();

  } catch (error) {

    console.error(error);

    showMessage(
      "action-message",
      "Something went wrong: " +
      error.message
    );
  }
}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(id) {

  const safeId =
    String(id);

  const nameInput =
    document.getElementById(
      `name-${safeId}`
    );

  const priceInput =
    document.getElementById(
      `price-${safeId}`
    );

  const categoryInput =
    document.getElementById(
      `category-${safeId}`
    );


  if (
    !nameInput ||
    !priceInput ||
    !categoryInput
  ) {

    showMessage(
      "action-message",
      "Could not find the product fields."
    );

    return;
  }


  const name =
    nameInput.value.trim();

  const price =
    Number(priceInput.value);

  const category =
    categoryInput.value;


  if (!name) {

    showMessage(
      "action-message",
      "Product name cannot be empty."
    );

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    showMessage(
      "action-message",
      "Please enter a valid price."
    );

    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({

          name: name,

          price: price,

          category: category

        })
        .eq("id", id);


    if (error) {

      console.error(error);

      showMessage(
        "action-message",
        "Unable to save product: " +
        error.message
      );

      return;
    }


    showMessage(
      "action-message",
      "Product updated successfully! 💾",
      true
    );


    await loadProducts();

  } catch (error) {

    console.error(error);

    showMessage(
      "action-message",
      "Something went wrong: " +
      error.message
    );
  }
}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

  showMessage(
    "action-message",
    "Deleting product..."
  );

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id)
        .select();


    if (error) {

      console.error(error);

      showMessage(
        "action-message",
        "Unable to delete product: " +
        error.message
      );

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      showMessage(
        "action-message",
        "The product was not deleted. Check your Supabase DELETE permission."
      );

      return;
    }


    showMessage(
      "action-message",
      "Product deleted successfully! 🗑️",
      true
    );


    await loadProducts();

  } catch (error) {

    console.error(error);

    showMessage(
      "action-message",
      "Something went wrong: " +
      error.message
    );
  }
}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

  const container =
    document.getElementById("orders");

  container.innerHTML =
    '<p class="empty">Loading orders...</p>';

  try {

    const {
      data: orders,
      error
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML =
        `<p class="empty">
          Unable to load orders.<br><br>
          ${escapeHTML(error.message)}
        </p>`;

      return;
    }


    const list =
      orders || [];


    document.getElementById("o")
      .textContent =
        list.length;


    if (!list.length) {

      container.innerHTML =
        '<p class="empty">No orders yet.</p>';

      return;
    }


    container.innerHTML =
      list.map(order => {

        return `

          <div class="order-card">

            <strong>
              Order #${escapeHTML(order.id)}
            </strong>

            <p>
              <strong>Customer:</strong>
              ${escapeHTML(
                order.customer_name ||
                "N/A"
              )}
            </p>

            <p>
              <strong>Phone:</strong>
              ${escapeHTML(
                order.phone ||
                order.customer_phone ||
                "N/A"
              )}
            </p>

            <p>
              <strong>Address:</strong>
              ${escapeHTML(
                order.address ||
                order.customer_address ||
                "N/A"
              )}
            </p>

            <p>
              <strong>Total:</strong>
              ${formatMoney(order.total)}
            </p>

            <p>
              <strong>Status:</strong>
              ${escapeHTML(
                order.status ||
                "Pending"
              )}
            </p>

          </div>

        `;

      }).join("");


  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<p class="empty">
        Unable to load orders.<br><br>
        ${escapeHTML(error.message)}
      </p>`;
  }
}
