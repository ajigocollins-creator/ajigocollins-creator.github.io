<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CEO Dashboard - Collins Clothing</title>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase configuration -->
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    .hidden {
      display: none !important;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      margin-bottom: 12px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #111827;
    }

    /* =========================
       LOGIN
    ========================= */

    #login-box {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111827, #374151);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .login-card h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .login-card p {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .login-btn {
      width: 100%;
      background: #111827;
      color: white;
      padding: 14px;
    }

    #login-message,
    #product-message {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
      min-height: 20px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .stat small {
      color: #64748b;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      margin-top: 8px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .section h2 {
      margin-top: 0;
    }

    /* =========================
       ADD PRODUCT
    ========================= */

    .preview {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      display: none;
      margin-bottom: 12px;
    }

    .add-btn {
      background: #16a34a;
      color: white;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .refresh-btn {
      background: #2563eb;
      color: white;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .product-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 15px;
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      background: #e2e8f0;
      margin-bottom: 12px;
    }

    .product-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .save-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .status-available {
      background: #16a34a;
      color: white;
    }

    .status-sold {
      background: #64748b;
      color: white;
    }

    /* =========================
       ORDERS
    ========================= */

    .order-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .order-card p {
      margin: 6px 0;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 20px;
    }

    .error-box {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .success-box {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 15px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .product-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {

      .container {
        padding: 12px;
      }

      .section {
        padding: 15px;
      }

      header h1 {
        font-size: 18px;
      }

      .stat strong {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login-box">

  <div class="login-card">

    <h1>CEO Login 🔐</h1>

    <p>Collins Clothing Admin</p>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      type="password"
      id="pass"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      Login
    </button>

    <div id="login-message"></div>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="app" class="hidden">

  <header>

    <h1>
      Collins Clothing — CEO Dashboard 👑
    </h1>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </header>


  <main class="container">


    <!-- =================================================
         STATS
    ================================================= -->

    <div class="stats">

      <div class="stat">
        <small>Total Products</small>
        <strong id="t">0</strong>
      </div>

      <div class="stat">
        <small>Available</small>
        <strong id="a">0</strong>
      </div>

      <div class="stat">
        <small>Sold Out</small>
        <strong id="s">0</strong>
      </div>

      <div class="stat">
        <small>Orders</small>
        <strong id="o">0</strong>
      </div>

    </div>


    <!-- =================================================
         ADD PRODUCT
    ================================================= -->

    <section class="section">

      <h2>➕ Add New Product</h2>

      <input
        type="text"
        id="nname"
        placeholder="Product name"
      >

      <input
        type="number"
        id="nprice"
        placeholder="Price in ₦"
        min="0"
      >

      <input
        type="file"
        id="img"
        accept="image/*"
        onchange="previewImage()"
      >

      <img
        id="prev"
        class="preview"
        alt="Product preview"
      >

      <button
        class="add-btn"
        id="addBtn"
        onclick="addProduct()"
      >
        Add Product
      </button>

      <div id="product-message"></div>

    </section>


    <!-- =================================================
         MANAGE PRODUCTS
    ================================================= -->

    <section class="section">

      <div class="toolbar">

        <h2>🛍️ Manage Products</h2>

        <button
          class="refresh-btn"
          onclick="loadProducts()"
        >
          🔄 Refresh
        </button>

      </div>

      <div
        id="plist"
        class="product-list"
      >

        <p class="empty">
          Login to load products...
        </p>

      </div>

    </section>


    <!-- =================================================
         ORDERS
    ================================================= -->

    <section class="section">

      <div class="toolbar">

        <h2>📦 Orders</h2>

        <button
          class="refresh-btn"
          onclick="loadOrders()"
        >
          🔄 Refresh Orders
        </button>

      </div>

      <div id="orders">

        <p class="empty">
          Login to load orders...
        </p>

      </div>

    </section>

  </main>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

if (
  typeof SUPABASE_URL === "undefined" ||
  typeof SUPABASE_ANON_KEY === "undefined"
) {

  document.getElementById("login-message").textContent =
    "Supabase configuration was not loaded.";

  throw new Error(
    "SUPABASE_URL or SUPABASE_ANON_KEY is missing."
  );
}


if (
  !window.supabase ||
  typeof window.supabase.createClient !== "function"
) {

  document.getElementById("login-message").textContent =
    "Supabase library failed to load.";

  throw new Error(
    "Supabase JavaScript library was not loaded."
  );
}


/*
   IMPORTANT:
   We create ONE client only.

   It is stored as:
   window.collinsSupabase
*/

window.collinsSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const db = window.collinsSupabase;


/* =====================================================
   HELPERS
===================================================== */

function showMessage(
  elementId,
  message,
  success = false
) {

  const element =
    document.getElementById(elementId);

  if (!element) return;

  element.textContent = message;

  element.style.color =
    success
      ? "#16a34a"
      : "#dc2626";
}


function formatMoney(value) {

  return "₦" +
    Number(value || 0)
      .toLocaleString("en-NG");
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("pass")
      .value;

  if (!email || !password) {

    showMessage(
      "login-message",
      "Please enter your email and password."
    );

    return;
  }


  const button =
    document.getElementById("loginBtn");

  button.disabled = true;
  button.textContent = "Logging in...";


  showMessage(
    "login-message",
    "Checking login..."
  );


  try {

    const {
      data,
      error
    } = await db.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {

      console.error(
        "Login error:",
        error
      );

      showMessage(
        "login-message",
        error.message
      );

      return;
    }


    if (
      !data ||
      !data.user
    ) {

      showMessage(
        "login-message",
        "Login failed. Please try again."
      );

      return;
    }


    document
      .getElementById("login-box")
      .classList.add("hidden");


    document
      .getElementById("app")
      .classList.remove("hidden");


    document.getElementById("login-message")
      .textContent = "";


    await loadDashboard();


  } catch (error) {

    console.error(
      "Login exception:",
      error
    );

    showMessage(
      "login-message",
      "Login error: " +
      error.message
    );

  } finally {

    button.disabled = false;
    button.textContent = "Login";

  }
}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession() {

  try {

    const {
      data,
      error
    } = await db.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      return;
    }


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      document
        .getElementById("login-box")
        .classList.add("hidden");


      document
        .getElementById("app")
        .classList.remove("hidden");


      await loadDashboard();

    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );

  }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  try {

    await db.auth.signOut();

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );
  }


  document
    .getElementById("app")
    .classList.add("hidden");


  document
    .getElementById("login-box")
    .classList.remove("hidden");


  document
    .getElementById("pass")
    .value = "";


  document
    .getElementById("plist")
    .innerHTML =
      '<p class="empty">Login to load products...</p>';


  document
    .getElementById("orders")
    .innerHTML =
      '<p class="empty">Login to load orders...</p>';
}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

  await loadProducts();

  await loadOrders();

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const container =
    document.getElementById("plist");


  container.innerHTML =
    '<p class="empty">Loading products...</p>';


  try {

    const {
      data: products,
      error
    } = await db
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(
        "Product error:",
        error
      );

      container.innerHTML = `
        <div class="error-box">

          <strong>
            Unable to load products.
          </strong>

          <br><br>

          ${escapeHTML(error.message)}

        </div>
      `;

      return;
    }


    const list =
      products || [];


    updateProductStats(list);

    renderProducts(list);


  } catch (error) {

    console.error(error);


    container.innerHTML = `
      <div class="error-box">

        Unable to load products.

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;
  }
}


/* =====================================================
   PRODUCT STATS
===================================================== */

function updateProductStats(products) {

  const total =
    products.length;


  const available =
    products.filter(function(product) {

      return product.available !== false;

    }).length;


  const sold =
    total - available;


  document.getElementById("t")
    .textContent = total;


  document.getElementById("a")
    .textContent = available;


  document.getElementById("s")
    .textContent = sold;
}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(products) {

  const container =
    document.getElementById("plist");


  if (!products.length) {

    container.innerHTML =
      '<p class="empty">No products found.</p>';

    return;
  }


  container.innerHTML =
    products.map(function(product) {

      const id =
        product.id;


      const safeId =
        escapeHTML(id);


      const name =
        escapeHTML(
          product.name || ""
        );


      const price =
        Number(product.price) || 0;


      const image =
        product.image_url ||
        product.image ||
        "logo.png";


      const safeImage =
        escapeHTML(image);


      const available =
        product.available !== false;


      return `

        <div
          class="product-card"
          id="product-${safeId}"
        >

          <img
            src="${safeImage}"
            alt="${name}"
            onerror="this.onerror=null;this.src='logo.png';"
          >


          <input
            type="text"
            id="name-${safeId}"
            value="${name}"
            placeholder="Product name"
          >


          <input
            type="number"
            id="price-${safeId}"
            value="${price}"
            min="0"
            placeholder="Price"
          >


          <div class="product-buttons">

            <button
              class="${
                available
                  ? "status-available"
                  : "status-sold"
              }"
              onclick="toggleProduct(
                ${JSON.stringify(id)},
                ${available}
              )"
            >

              ${
                available
                  ? "Available ✅"
                  : "Sold Out ❌"
              }

            </button>


            <button
              class="save-btn"
              onclick="saveProduct(
                ${JSON.stringify(id)}
              )"
            >

              Save 💾

            </button>


            <button
              class="delete-btn"
              onclick="deleteProduct(
                ${JSON.stringify(id)}
              )"
            >

              Delete 🗑️

            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =====================================================
   PREVIEW IMAGE
===================================================== */

function previewImage() {

  const input =
    document.getElementById("img");


  const preview =
    document.getElementById("prev");


  const file =
    input.files[0];


  if (!file) {

    preview.src = "";

    preview.style.display =
      "none";

    return;
  }


  preview.src =
    URL.createObjectURL(file);


  preview.style.display =
    "block";
}


/* =====================================================
   ADD PRODUCT
===================================================== */

async function addProduct() {

  const name =
    document
      .getElementById("nname")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("nprice")
        .value
    );


  const file =
    document
      .getElementById("img")
      .files[0];


  const addButton =
    document.getElementById("addBtn");


  if (!name) {

    showMessage(
      "product-message",
      "Please enter the product name."
    );

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    showMessage(
      "product-message",
      "Please enter a valid price."
    );

    return;
  }


  if (!file) {

    showMessage(
      "product-message",
      "Please choose a product image."
    );

    return;
  }


  addButton.disabled = true;

  addButton.textContent =
    "Uploading...";


  showMessage(
    "product-message",
    "Uploading product..."
  );


  try {

    /* =============================================
       CREATE UNIQUE FILE NAME
    ============================================= */

    const extension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "jpg";


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    /* =============================================
       UPLOAD IMAGE — ONLY ONCE
    ============================================= */

    const {
      error: uploadError
    } = await db.storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


    if (uploadError) {

      console.error(
        "Upload error:",
        uploadError
      );

      showMessage(
        "product-message",
        "Image upload failed: " +
        uploadError.message
      );

      return;
    }


    /* =============================================
       GET PUBLIC URL
    ============================================= */

    const {
      data: publicData
    } = db.storage
      .from("product-images")
      .getPublicUrl(fileName);


    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      showMessage(
        "product-message",
        "Could not create image URL."
      );

      return;
    }


    const imageUrl =
      publicData.publicUrl;


    /* =============================================
       INSERT PRODUCT
    ============================================= */

    const {
      error: insertError
    } = await db
      .from("products")
      .insert({

        name: name,

        price: price,

        image_url: imageUrl,

        available: true

      });


    if (insertError) {

      console.error(
        "Insert error:",
        insertError
      );

      showMessage(
        "product-message",
        "Product database error: " +
        insertError.message
      );

      return;
    }


    /* =============================================
       RESET FORM
    ============================================= */

    document
      .getElementById("nname")
      .value = "";


    document
      .getElementById("nprice")
      .value = "";


    document
      .getElementById("img")
      .value = "";


    const preview =
      document.getElementById("prev");


    preview.src = "";

    preview.style.display =
      "none";


    showMessage(
      "product-message",
      "Product added successfully! 🎉",
      true
    );


    await loadProducts();


  } catch (error) {

    console.error(
      "Add product error:",
      error
    );


    showMessage(
      "product-message",
      "Something went wrong: " +
      error.message
    );

  } finally {

    addButton.disabled = false;

    addButton.textContent =
      "Add Product";

  }
}


/* =====================================================
   TOGGLE AVAILABLE / SOLD OUT
===================================================== */

async function toggleProduct(
  id,
  currentStatus
) {

  try {

    const {
      error
    } = await db
      .from("products")
      .update({

        available:
          !currentStatus

      })
      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Unable to change product status.\n\n" +
        error.message
      );

      return;
    }


    await loadProducts();


  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong.\n\n" +
      error.message
    );

  }
}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(id) {

  const safeId =
    String(id);


  const nameInput =
    document.getElementById(
      "name-" + safeId
    );


  const priceInput =
    document.getElementById(
      "price-" + safeId
    );


  if (
    !nameInput ||
    !priceInput
  ) {

    alert(
      "Could not find the product fields."
    );

    return;
  }


  const name =
    nameInput.value.trim();


  const price =
    Number(priceInput.value);


  if (!name) {

    alert(
      "Product name cannot be empty."
    );

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    alert(
      "Please enter a valid price."
    );

    return;
  }


  try {

    const {
      error
    } = await db
      .from("products")
      .update({

        name: name,

        price: price

      })
      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Unable to save product.\n\n" +
        error.message
      );

      return;
    }


    alert(
      "Product updated successfully! 💾"
    );


    await loadProducts();


  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong while saving.\n\n" +
      error.message
    );

  }
}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this product?\n\n" +
      "The product will be removed from the shop."
    );


  if (!confirmed) {
    return;
  }


  try {

    const {
      data,
      error
    } = await db
      .from("products")
      .delete()
      .eq("id", id)
      .select();


    if (error) {

      console.error(error);

      alert(
        "Unable to delete product.\n\n" +
        error.message
      );

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      alert(
        "The product was not deleted.\n\n" +
        "Check your Supabase DELETE policy."
      );

      return;
    }


    alert(
      "Product deleted successfully! 🗑️"
    );


    await loadProducts();


  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong while deleting.\n\n" +
      error.message
    );

  }
}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

  const container =
    document.getElementById("orders");


  container.innerHTML =
    '<p class="empty">Loading orders...</p>';


  try {

    const {
      data: orders,
      error
    } = await db
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(
        "Orders error:",
        error
      );


      container.innerHTML = `
        <div class="error-box">

          <strong>
            Unable to load orders.
          </strong>

          <br><br>

          ${escapeHTML(error.message)}

        </div>
      `;

      return;
    }


    const list =
      orders || [];


    document
      .getElementById("o")
      .textContent =
        list.length;


    if (!list.length) {

      container.innerHTML =
        '<p class="empty">No orders yet.</p>';

      return;
    }


    container.innerHTML =
      list.map(function(order) {

        /*
          Support both the old and new
          column names.
        */

        const phone =
          order.customer_phone ||
          order.phone ||
          "N/A";


        const address =
          order.customer_address ||
          order.address ||
          "N/A";


        return `

          <div class="order-card">

            <strong>
              Order #${escapeHTML(order.id)}
            </strong>

            <p>
              <strong>Customer:</strong>
              ${escapeHTML(
                order.customer_name ||
                "N/A"
              )}
            </p>

            <p>
              <strong>Phone:</strong>
              ${escapeHTML(phone)}
            </p>

            <p>
              <strong>Address:</strong>
              ${escapeHTML(address)}
            </p>

            <p>
              <strong>Total:</strong>
              ${formatMoney(order.total)}
            </p>

            <p>
              <strong>Status:</strong>
              ${escapeHTML(
                order.status ||
                "Pending"
              )}
            </p>

          </div>

        `;

      }).join("");


  } catch (error) {

    console.error(error);


    container.innerHTML = `
      <div class="error-box">

        Unable to load orders.

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;
  }
}
