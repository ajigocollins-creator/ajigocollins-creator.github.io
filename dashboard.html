<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CEO Dashboard - Collins Clothing</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .card-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
    }

    .card-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .card-item input {
      width: 100%;
      padding: 9px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-toggle,
    .save-btn,
    .delete-btn {
      border: none;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .status-toggle.available {
      background: #dcfce7;
      color: #166534;
    }

    .status-toggle.sold {
      background: #fee2e2;
      color: #991b1b;
    }

    .save-btn {
      background: #111;
      color: white;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
    }

    .login-error {
      color: #dc2626;
      margin-top: 10px;
      font-size: 14px;
    }

    .success {
      color: #16a34a;
      margin-top: 10px;
      font-size: 14px;
    }

    .empty {
      color: #666;
      padding: 15px 0;
    }

    .product-message {
      margin-top: 10px;
      font-size: 14px;
    }

    .preview-image {
      display: none;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      margin: 10px 0;
    }

    .order-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .danger-text {
      color: #dc2626;
    }
  </style>
</head>

<body class="dashboard-body">

  <!-- =========================================
       LOGIN
  ========================================== -->

  <div id="login-box" class="login-box" style="margin:80px auto;">

    <h2>CEO Dashboard</h2>

    <p style="color:#666;margin-bottom:16px;">
      Collins Clothing
    </p>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      id="pass"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      Login
    </button>

    <p id="login-message"></p>

  </div>


  <!-- =========================================
       DASHBOARD
  ========================================== -->

  <div id="app" style="display:none;">

    <header class="dash-header">

      <div>
        <strong>Collins Clothing</strong> — CEO
      </div>

      <button
        onclick="logout()"
        style="
          background:#ef4444;
          color:#fff;
          border:none;
          padding:8px 14px;
          border-radius:6px;
        "
      >
        Logout
      </button>

    </header>


    <div class="dash-container">


      <!-- =====================================
           STATISTICS
      ====================================== -->

      <div class="stats-grid">

        <div class="stat-box">
          <div class="num" id="t">0</div>
          <div class="label">Total</div>
        </div>

        <div class="stat-box">
          <div class="num" id="a">0</div>
          <div class="label">Available</div>
        </div>

        <div class="stat-box">
          <div class="num" id="s">0</div>
          <div class="label">Sold Out</div>
        </div>

        <div class="stat-box">
          <div class="num" id="o">0</div>
          <div class="label">Orders</div>
        </div>

      </div>


      <!-- =====================================
           ADD PRODUCT
      ====================================== -->

      <div class="dash-card">

        <h2>➕ Add New Product</h2>

        <input
          type="file"
          id="img"
          accept="image/*"
        >

        <img
          id="prev"
          class="preview-image"
          alt="Image preview"
        >

        <div class="form-group">

          <label>Product Name</label>

          <input
            id="nname"
            type="text"
            placeholder="Example: Steady Grinding Black Tee"
          >

        </div>


        <div class="form-group">

          <label>Price (₦)</label>

          <input
            id="nprice"
            type="number"
            value="15000"
            min="1"
          >

        </div>


        <button
          class="save-btn"
          onclick="addProduct()"
          style="
            width:100%;
            padding:12px;
          "
        >
          Add Product
        </button>

        <p
          id="product-message"
          class="product-message"
        ></p>

      </div>


      <!-- =====================================
           ORDERS
      ====================================== -->

      <div class="dash-card">

        <h2>📦 Orders</h2>

        <div id="orders">
          Loading orders...
        </div>

      </div>


      <!-- =====================================
           MANAGE PRODUCTS
      ====================================== -->

      <div class="dash-card">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
          "
        >

          <h2>👕 Manage Products</h2>

          <button
            onclick="loadProducts()"
            style="
              padding:8px 12px;
              border:1px solid #ddd;
              background:#fff;
              border-radius:6px;
              cursor:pointer;
            "
          >
            🔄 Refresh
          </button>

        </div>

        <p style="color:#666;font-size:.9rem;">
          Edit the name or price, then tap Save.
          Tap Available/Sold Out to change stock status.
        </p>

        <div id="plist">
          Loading products...
        </div>

      </div>

    </div>

  </div>


  <!-- =========================================
       SUPABASE
  ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <script>

    /* =========================================
       SUPABASE CLIENT
    ========================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================================
       LOGIN
    ========================================== */

    document.getElementById("loginBtn").onclick =
      login;


    document.getElementById("pass").addEventListener(
      "keypress",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    async function login() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("pass").value;

      const message =
        document.getElementById("login-message");


      if (!email || !password) {

        message.className = "login-error";

        message.textContent =
          "Enter your email and password.";

        return;

      }


      message.className = "";

      message.textContent =
        "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        message.className =
          "login-error";

        message.textContent =
          error.message;

        return;

      }


      if (data.user) {

        document.getElementById(
          "login-box"
        ).style.display = "none";


        document.getElementById(
          "app"
        ).style.display = "block";


        loadDashboard();

      }

    }


    /* =========================================
       LOGOUT
    ========================================== */

    async function logout() {

      await supabaseClient.auth.signOut();

      location.reload();

    }


    /* =========================================
       LOAD DASHBOARD
    ========================================== */

    async function loadDashboard() {

      await loadProducts();

      await loadOrders();

    }


    /* =========================================
       LOAD PRODUCTS
    ========================================== */

    async function loadProducts() {

      const container =
        document.getElementById("plist");


      container.innerHTML =
        "<p>Loading products...</p>";


      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*");


      if (error) {

        container.innerHTML = `
          <p class="login-error">
            Unable to load products:<br>
            ${escapeHTML(error.message)}
          </p>
        `;

        return;

      }


      const products = data || [];


      /* Statistics */

      document.getElementById("t")
        .textContent = products.length;


      document.getElementById("a")
        .textContent =
          products.filter(function(product) {

            return product.available === true;

          }).length;


      document.getElementById("s")
        .textContent =
          products.filter(function(product) {

            return product.available === false;

          }).length;


      renderProducts(products);

    }


    /* =========================================
       RENDER PRODUCTS
    ========================================== */

    function renderProducts(products) {

      const container =
        document.getElementById("plist");


      if (!products.length) {

        container.innerHTML = `
          <p class="empty">
            No products yet.
          </p>
        `;

        return;

      }


      let html = "";


      products.forEach(function(product) {

        const id =
          product.id;


        const image =
          product.image_url || "logo.png";


        html += `

          <div
            class="card-item"
            data-id="${escapeHTML(id)}"
          >

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.name || "Product")}"
              onerror="this.src='logo.png'"
            >


            <div style="flex:1;">

              <input
                class="en"
                type="text"
                value="${escapeHTML(product.name || "")}"
                placeholder="Product name"
              >


              <input
                class="ep"
                type="number"
                value="${Number(product.price) || 0}"
                min="1"
              >


              <div class="row-actions">

                <button
                  class="status-toggle ${
                    product.available
                      ? "available"
                      : "sold"
                  }"
                  onclick='toggleProduct(${JSON.stringify(id)}, ${product.available})'
                >
                  ${
                    product.available
                      ? "🟢 Available"
                      : "🔴 Sold Out"
                  }
                </button>


                <button
                  class="save-btn"
                  onclick='saveProduct(${JSON.stringify(id)})'
                >
                  💾 Save
                </button>


                <button
                  class="delete-btn"
                  onclick='deleteProduct(${JSON.stringify(id)})'
                >
                  🗑️ Delete
                </button>

              </div>

            </div>

          </div>

        `;

      });


      container.innerHTML = html;

    }


    /* =========================================
       ADD PRODUCT
    ========================================== */

    async function addProduct() {

      const name =
        document.getElementById("nname")
          .value
          .trim();


      const price =
        Number(
          document.getElementById("nprice").value
        );


      const file =
        document.getElementById("img")
          .files[0];


      const message =
        document.getElementById(
          "product-message"
        );


      if (!name || !price || !file) {

        message.className =
          "login-error";

        message.textContent =
          "Add a product name, price and photo.";

        return;

      }


      message.className = "";

      message.textContent =
        "Uploading product...";


      try {

        const fileName =
          Date.now() +
          "-" +
          file.name.replace(
            /[^a-zA-Z0-9.-]/g,
            "-"
          );


        /* Upload image */

        const { error: uploadError } =
          await supabaseClient.storage
            .from("product-images")
            .upload(
              fileName,
              file
            );


        if (uploadError) {

          throw uploadError;

        }


        /* Public image URL */

        const { data: publicData } =
          supabaseClient.storage
            .from("product-images")
            .getPublicUrl(fileName);


        const imageURL =
          publicData.publicUrl;


        /* Insert product */

        const { error: insertError } =
          await supabaseClient
            .from("products")
            .insert({

              name: name,

              price: price,

              image_url: imageURL,

              available: true

            });


        if (insertError) {

          await supabaseClient.storage
            .from("product-images")
            .remove([fileName]);

          throw insertError;

        }


        /* Clear form */

        document.getElementById(
          "nname"
        ).value = "";


        document.getElementById(
          "nprice"
        ).value = "15000";


        document.getElementById(
          "img"
        ).value = "";


        document.getElementById(
          "prev"
        ).style.display = "none";


        message.className =
          "success";

        message.textContent =
          "Product added successfully! ✅";


        await loadProducts();

      }

      catch (error) {

        message.className =
          "login-error";

        message.textContent =
          "Error: " + error.message;

      }

    }


    /* =========================================
       IMAGE PREVIEW
    ========================================== */

    document.getElementById("img").onchange =
      function(event) {

        const file =
          event.target.files[0];


        if (!file) return;


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            const preview =
              document.getElementById("prev");


            preview.src =
              e.target.result;


            preview.style.display =
              "block";

          };


        reader.readAsDataURL(file);

      };


    /* =========================================
       TOGGLE AVAILABLE / SOLD OUT
    ========================================== */

    async function toggleProduct(
      id,
      currentStatus
    ) {

      const { error } =
        await supabaseClient
          .from("products")
          .update({

            available:
              !currentStatus

          })
          .eq("id", id);


      if (error) {

        alert(
          "Unable to update status:\n" +
          error.message
        );

        return;

      }


      await loadProducts();

    }


    /* =========================================
       SAVE NAME + PRICE
    ========================================== */

    async function saveProduct(id) {

      const card =
        document.querySelector(
          '.card-item[data-id="' +
          CSS.escape(String(id)) +
          '"]'
        );


      if (!card) {

        alert("Product not found.");

        return;

      }


      const name =
        card.querySelector(".en")
          .value
          .trim();


      const price =
        Number(
          card.querySelector(".ep").value
        );


      if (!name || !price) {

        alert(
          "Enter a valid product name and price."
        );

        return;

      }


      const { error } =
        await supabaseClient
          .from("products")
          .update({

            name: name,

            price: price

          })
          .eq("id", id);


      if (error) {

        alert(
          "Unable to save product:\n" +
          error.message
        );

        return;

      }


      alert(
        "Product saved successfully! ✅"
      );


      await loadProducts();

    }


    /* =========================================
       DELETE PRODUCT
    ========================================== */

    async function deleteProduct(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this product?\n\n" +
          "This will remove it from the shop."
        );


      if (!confirmed) return;


      const { error } =
        await supabaseClient
          .from("products")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "Unable to delete product:\n" +
          error.message
        );

        return;

      }


      alert(
        "Product deleted successfully! 🗑️"
      );


      await loadProducts();

    }


    /* =========================================
       LOAD ORDERS
    ========================================== */

    async function loadOrders() {

      const container =
        document.getElementById("orders");


      const { data, error } =
        await supabaseClient
          .from("orders")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        container.innerHTML = `
          <p class="login-error">
            Unable to load orders:<br>
            ${escapeHTML(error.message)}
          </p>
        `;

        document.getElementById("o")
          .textContent = "0";

        return;

      }


      const orders = data || [];


      document.getElementById("o")
        .textContent = orders.length;


      if (!orders.length) {

        container.innerHTML = `
          <p class="empty">
            No orders yet.
          </p>
        `;

        return;

      }


      let html = "";


      orders.forEach(function(order) {

        html += `

          <div class="order-card">

            <strong>
              Order #${escapeHTML(order.id)}
            </strong>

            <div style="margin-top:7px;">
              Customer:
              ${escapeHTML(
                order.customer_name || "Customer"
              )}
            </div>

            <div>
              Phone:
              ${escapeHTML(
                order.phone || "Not provided"
              )}
            </div>

            <div>
              Address:
              ${escapeHTML(
                order.address || "Pickup"
              )}
            </div>

            <div style="margin-top:7px;">
              <strong>
                ₦${Number(
                  order.total || 0
                ).toLocaleString()}
              </strong>
            </div>

            <div style="margin-top:5px;">
              Status:
              ${escapeHTML(
                order.status || "Pending"
              )}
            </div>

          </div>

        `;

      });


      container.innerHTML = html;

    }


    /* =========================================
       SECURITY HELPER
    ========================================== */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================
       CHECK EXISTING SESSION
    ========================================== */

    async function checkExistingSession() {

      const { data } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {

        document.getElementById(
          "login-box"
        ).style.display = "none";


        document.getElementById(
          "app"
        ).style.display = "block";


        loadDashboard();

      }

    }


    checkExistingSession();

  </script>

</body>
</html>
