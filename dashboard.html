<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard | Collins Clothing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <!-- Login -->
  <div id="login-section">
    <div class="login-box">
      <h2 style="margin-bottom:8px;">CEO Dashboard</h2>
      <p style="color:#666;font-size:0.9rem;margin-bottom:20px;">Collins Clothing Admin</p>
      <input type="password" id="password" placeholder="Enter password" onkeypress="if(event.key==='Enter') doLogin()">
      <button onclick="doLogin()">Login</button>
      <p style="margin-top:16px;font-size:0.8rem;color:#999;">Contact admin if you forgot the password</p>
      <p style="margin-top:8px;"><a href="index.html" style="color:#e11d48;font-size:0.9rem;">← Back to Shop</a></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dash-section" style="display:none;">
    <header class="dash-header">
      <div><strong>Collins Clothing</strong> — CEO Panel</div>
      <div style="display:flex;gap:12px;align-items:center;">
        <a href="index.html" style="color:#94a3b8;font-size:0.9rem;">View Shop</a>
        <button onclick="showChangePassword()" style="background:#334155;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;">Change Password</button>
        <button onclick="doLogout()" style="background:#ef4444;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;">Logout</button>
      </div>
    </header>

    <div class="dash-container">
      <div class="stats-grid">
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label">Total Products</div></div>
        <div class="stat-box"><div class="num" id="stat-available">0</div><div class="label">Available</div></div>
        <div class="stat-box"><div class="num" id="stat-sold">0</div><div class="label">Sold Out</div></div>
        <div class="stat-box"><div class="num" id="stat-orders">0</div><div class="label">Orders</div></div>
      </div>

      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2>Customer Orders</h2>
          <button onclick="clearOrders()" style="padding:8px 14px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-size:0.85rem;">Clear All</button>
        </div>
        <div id="orders-list" class="orders-list"></div>
      </div>

      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2>Manage Products</h2>
          <button onclick="resetToDefault()" style="padding:8px 14px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-size:0.85rem;">Reset to Default</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="product-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product Name</th>
                <th>Price (₦)</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div id="password-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:center;justify-content:center;">
    <div style="background:white;padding:24px;border-radius:12px;width:90%;max-width:360px;">
      <h3 style="margin-bottom:16px;">Change Password</h3>
      <input type="password" id="new-pass" placeholder="New password" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;">
      <input type="password" id="confirm-pass" placeholder="Confirm new password" style="width:100%;padding:12px;margin-bottom:16px;border:1px solid #ddd;border-radius:8px;">
      <div style="display:flex;gap:10px;">
        <button onclick="document.getElementById('password-modal').style.display='none'" style="flex:1;padding:12px;border:1px solid #ddd;background:white;border-radius:8px;">Cancel</button>
        <button onclick="changePassword()" style="flex:1;padding:12px;background:#e11d48;color:white;border:none;border-radius:8px;font-weight:600;">Save</button>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="dashboard.js"></script>

  <script>
    // Get saved password or use default
    function getPassword() {
      return localStorage.getItem('collins_dash_pass') || 'collins2026';
    }

    function doLogin() {
      const pass = document.getElementById('password').value;
      if (pass === getPassword()) {
        sessionStorage.setItem('collins_ceo', 'true');
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dash-section').style.display = 'block';
        forceLoad();
      } else {
        alert('Wrong password');
      }
    }

    function doLogout() {
      sessionStorage.removeItem('collins_ceo');
      location.reload();
    }

    function showChangePassword() {
      document.getElementById('password-modal').style.display = 'flex';
    }

    function changePassword() {
      const newPass = document.getElementById('new-pass').value;
      const confirm = document.getElementById('confirm-pass').value;

      if (!newPass || newPass.length < 4) {
        alert('Password must be at least 4 characters');
        return;
      }
      if (newPass !== confirm) {
        alert('Passwords do not match');
        return;
      }

      localStorage.setItem('collins_dash_pass', newPass);
      document.getElementById('password-modal').style.display = 'none';
      document.getElementById('new-pass').value = '';
      document.getElementById('confirm-pass').value = '';
      alert('Password changed successfully!');
    }

    function forceLoad() {
      setTimeout(function() {
        if (typeof renderDashboard === 'function') renderDashboard();
        if (typeof renderOrders === 'function') renderOrders();

        const total = document.getElementById('stat-total');
        if (total && total.textContent === '0') {
          localStorage.removeItem('collins_products');
          if (typeof renderDashboard === 'function') renderDashboard();
        }
      }, 400);
    }

    // Auto login if already logged in
    if (sessionStorage.getItem('collins_ceo') === 'true') {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dash-section').style.display = 'block';
      forceLoad();
    }
  </script>
</body>
        </html>
