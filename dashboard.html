<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Collins Clothing — CEO Dashboard 👑</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #111;
    }

    .top {
      background: white;
      padding: 35px 25px;
      border-bottom: 1px solid #ddd;
    }

    .top h1 {
      margin: 0 0 25px;
      font-size: 30px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    .black-btn {
      background: #111;
      color: white;
      padding: 16px 28px;
      border-radius: 15px;
      font-size: 17px;
    }

    .danger-btn {
      background: #dc2626;
      color: white;
      padding: 12px 17px;
      border-radius: 10px;
    }

    .green-btn {
      background: #16a34a;
      color: white;
      padding: 12px 17px;
      border-radius: 10px;
    }

    .edit-btn {
      background: #2563eb;
      color: white;
      padding: 12px 17px;
      border-radius: 10px;
    }

    .cancel-btn {
      background: #777;
      color: white;
      padding: 12px 17px;
      border-radius: 10px;
    }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 17px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-size: 16px;
      background: white;
    }

    .login-box button {
      width: 100%;
      margin-top: 5px;
    }

    #loginMessage {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 28px;
      border-radius: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    .stat-title {
      color: #666;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .stat-number {
      font-size: 40px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 30px;
      border-radius: 25px;
      margin-bottom: 30px;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    .section h2 {
      font-size: 32px;
      margin-top: 0;
    }

    .product-form {
      max-width: 650px;
    }

    .label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      font-size: 18px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    .product-list {
      display: grid;
      gap: 20px;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 20px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 20px;
    }

    .product-card img {
      width: 120px;
      height: 140px;
      object-fit: cover;
      border-radius: 15px;
      background: #eee;
    }

    .product-info h3 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .category {
      display: inline-block;
      background: #f1f1f1;
      padding: 7px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin-left: 5px;
    }

    .available {
      background: #dcfce7;
      color: #166534;
    }

    .sold {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .edit-area {
      margin-top: 15px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 15px;
      display: none;
    }

    .refresh-btn {
      float: right;
      margin-top: -55px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
      font-size: 18px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .top h1 {
        font-size: 25px;
      }

      .container {
        padding: 15px;
      }

      .section {
        padding: 20px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .stat {
        padding: 20px;
      }

      .stat-title {
        font-size: 16px;
      }

      .stat-number {
        font-size: 30px;
      }

      .product-card {
        grid-template-columns: 1fr;
      }

      .product-card img {
        width: 100%;
        height: 250px;
      }

      .refresh-btn {
        float: none;
        margin: 0 0 20px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

  <div class="login-box">

    <h1>Collins Clothing 👑</h1>

    <p style="text-align:center;color:#666;">
      CEO Admin Dashboard
    </p>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="black-btn"
      id="loginBtn"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

  <div class="top">

    <h1>
      Collins Clothing — CEO Dashboard 👑
    </h1>

    <button
      class="black-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="container">

    <!-- STATISTICS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          Total Products
        </div>

        <div
          class="stat-number"
          id="totalProducts"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Available
        </div>

        <div
          class="stat-number"
          id="availableProducts"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Sold Out
        </div>

        <div
          class="stat-number"
          id="soldProducts"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Orders
        </div>

        <div
          class="stat-number"
          id="ordersCount"
        >
          0
        </div>
      </div>

    </div>


    <!-- ADD PRODUCT -->

    <div class="section">

      <h2>
        ➕ Add New Product
      </h2>

      <div class="product-form">

        <label class="label">
          Product Name
        </label>

        <input
          id="productName"
          type="text"
          placeholder="Product name"
        >


        <label class="label">
          Price
        </label>

        <input
          id="productPrice"
          type="number"
          placeholder="Price in ₦"
        >


        <label class="label">
          Product Category
        </label>

        <select id="productCategory">

          <option value="T-Shirts">
            T-Shirts
          </option>

          <option value="Baggie Jeans">
            Baggie Jeans
          </option>

          <option value="Hoodies">
            Hoodies
          </option>

        </select>


        <label class="label">
          Product Image
        </label>

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >


        <img
          id="imagePreview"
          style="
            display:none;
            width:180px;
            height:180px;
            object-fit:cover;
            border-radius:15px;
            margin:10px 0;
          "
        >


        <button
          class="black-btn"
          onclick="addProduct()"
        >
          Add Product
        </button>

        <div id="message"></div>

      </div>

    </div>


    <!-- PRODUCTS -->

    <div class="section">

      <h2>
        All Products
      </h2>

      <button
        class="black-btn refresh-btn"
        onclick="loadProducts()"
      >
        🔄 Refresh
      </button>

      <div
        id="productList"
        class="product-list"
      >
        <div class="empty">
          Loading products...
        </div>
      </div>

    </div>


    <!-- ORDERS -->

    <div class="section">

      <h2>
        Orders
      </h2>

      <div id="ordersList">
        <div class="empty">
          Loading orders...
        </div>
      </div>

    </div>

  </div>

</div>


<script>

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// ===============================
// LOGIN
// ===============================

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.style.color = "red";
    message.textContent =
      "Please enter your email and password.";

    return;
  }

  message.style.color = "#555";
  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    message.style.color = "red";
    message.textContent = error.message;

    return;
  }

  showDashboard();

}


// ===============================
// SHOW DASHBOARD
// ===============================

async function showDashboard() {

  document.getElementById("loginScreen").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  await loadProducts();
  await loadOrders();

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


// ===============================
// CHECK SESSION
// ===============================

async function checkSession() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {

    showDashboard();

  }

}


// ===============================
// IMAGE PREVIEW
// ===============================

document
  .getElementById("productImage")
  .addEventListener("change", function() {

    const file = this.files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";
      return;

    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display = "block";

  });


// ===============================
// ADD PRODUCT
// ===============================

async function addProduct() {

  const name =
    document.getElementById("productName")
      .value.trim();

  const price =
    Number(
      document.getElementById("productPrice").value
    );

  const category =
    document.getElementById("productCategory")
      .value;

  const file =
    document.getElementById("productImage")
      .files[0];

  const message =
    document.getElementById("message");


  if (!name || !price || !file) {

    message.style.color = "red";

    message.textContent =
      "Please enter product name, price and image.";

    return;
  }


  message.style.color = "#555";
  message.textContent =
    "Uploading product...";


  try {

    // Create unique image name

    const extension =
      file.name.split(".").pop();

    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    // Upload image

    const upload =
      await supabaseClient.storage
        .from("product-images")
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: false
        });


    if (upload.error) {
      throw upload.error;
    }


    // Get public image URL

    const publicUrl =
      supabaseClient.storage
        .from("product-images")
        .getPublicUrl(fileName)
        .data
        .publicUrl;


    // Save product

    const { error } =
      await supabaseClient
        .from("products")
        .insert({

          name: name,

          price: price,

          category: category,

          image_url: publicUrl,

          available: true

        });


    if (error) {
      throw error;
    }


    message.style.color = "#16a34a";

    message.textContent =
      "Product added successfully! 🎉";


    // Clear form

    document.getElementById("productName")
      .value = "";

    document.getElementById("productPrice")
      .value = "";

    document.getElementById("productImage")
      .value = "";

    document.getElementById("imagePreview")
      .style.display = "none";


    await loadProducts();


  } catch (error) {

    console.error(error);

    message.style.color = "red";

    message.textContent =
      "Error: " + error.message;

  }

}


// ===============================
// LOAD PRODUCTS
// ===============================

async function loadProducts() {

  const list =
    document.getElementById("productList");

  list.innerHTML =
    '<div class="empty">Loading products...</div>';


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="error">
        Unable to load products.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    updateStats([]);

    return;
  }


  const products = data || [];

  updateStats(products);

  renderProducts(products);

}


// ===============================
// UPDATE STATISTICS
// ===============================

function updateStats(products) {

  const total =
    products.length;

  const available =
    products.filter(
      p => p.available !== false
    ).length;

  const sold =
    products.filter(
      p => p.available === false
    ).length;


  document.getElementById("totalProducts")
    .textContent = total;

  document.getElementById("availableProducts")
    .textContent = available;

  document.getElementById("soldProducts")
    .textContent = sold;

}


// ===============================
// RENDER PRODUCTS
// ===============================

function renderProducts(products) {

  const list =
    document.getElementById("productList");


  if (!products.length) {

    list.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;
  }


  list.innerHTML =
    products.map(product => {

      const available =
        product.available !== false;

      const category =
        normalizeCategory(
          product.category
        );


      const image =
        product.image_url ||
        product.image ||
        "logo.png";


      return `

        <div class="product-card">

          <img
            src="${escapeAttribute(image)}"
            onerror="this.src='logo.png'"
            alt="${escapeAttribute(product.name || 'Product')}"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(
                product.name || "Unnamed Product"
              )}
            </h3>

            <div class="price">
              ₦${Number(
                product.price || 0
              ).toLocaleString()}
            </div>

            <span class="category">
              ${escapeHtml(category)}
            </span>

            <span
              class="status ${
                available
                  ? "available"
                  : "sold"
              }"
            >
              ${
                available
                  ? "Available"
                  : "Sold Out"
              }
            </span>


            <!-- EDIT AREA -->

            <div
              class="edit-area"
              id="edit-${product.id}"
            >

              <input
                id="name-${product.id}"
                value="${escapeAttribute(
                  product.name || ""
                )}"
                placeholder="Product name"
              >

              <input
                id="price-${product.id}"
                type="number"
                value="${Number(
                  product.price || 0
                )}"
                placeholder="Price"
              >

              <select
                id="category-${product.id}"
              >

                <option
                  value="T-Shirts"
                  ${
                    category === "T-Shirts"
                      ? "selected"
                      : ""
                  }
                >
                  T-Shirts
                </option>

                <option
                  value="Baggie Jeans"
                  ${
                    category === "Baggie Jeans"
                      ? "selected"
                      : ""
                  }
                >
                  Baggie Jeans
                </option>

                <option
                  value="Hoodies"
                  ${
                    category === "Hoodies"
                      ? "selected"
                      : ""
                  }
                >
                  Hoodies
                </option>

              </select>

              <div class="actions">

                <button
                  class="green-btn"
                  onclick="saveProduct('${product.id}')"
                >
                  💾 Save Changes
                </button>

                <button
                  class="cancel-btn"
                  onclick="cancelEdit('${product.id}')"
                >
                  Cancel
                </button>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="actions">

              <button
                class="edit-btn"
                onclick="editProduct('${product.id}')"
              >
                ✏️ Edit
              </button>


              <button
                class="${
                  available
                    ? "danger-btn"
                    : "green-btn"
                }"
                onclick="toggleAvailability(
                  '${product.id}',
                  ${available}
                )"
              >
                ${
                  available
                    ? "🔴 Mark Sold Out"
                    : "🟢 Mark Available"
                }
              </button>


              <button
                class="danger-btn"
                onclick="deleteProduct(
                  '${product.id}'
                )"
              >
                🗑️ Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


// ===============================
// EDIT PRODUCT
// ===============================

function editProduct(id) {

  const box =
    document.getElementById(
      "edit-" + id
    );

  if (box) {
    box.style.display = "block";
  }

}


// ===============================
// CANCEL EDIT
// ===============================

function cancelEdit(id) {

  const box =
    document.getElementById(
      "edit-" + id
    );

  if (box) {
    box.style.display = "none";
  }

}


// ===============================
// SAVE EDIT
// ===============================

async function saveProduct(id) {

  const name =
    document.getElementById(
      "name-" + id
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "price-" + id
      ).value
    );

  const category =
    document.getElementById(
      "category-" + id
    ).value;


  if (!name || !price) {

    alert(
      "Product name and price are required."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .update({

        name: name,

        price: price,

        category: category

      })
      .eq("id", id);


  if (error) {

    alert(
      "Unable to save: " +
      error.message
    );

    return;
  }


  await loadProducts();

}


// ===============================
// AVAILABLE / SOLD OUT
// ===============================

async function toggleAvailability(
  id,
  currentlyAvailable
) {

  const newStatus =
    !currentlyAvailable;


  const { error } =
    await supabaseClient
      .from("products")
      .update({
        available: newStatus
      })
      .eq("id", id);


  if (error) {

    alert(
      "Unable to change status: " +
      error.message
    );

    return;
  }


  await loadProducts();

}


// ===============================
// DELETE PRODUCT
// ===============================

async function deleteProduct(id) {

  const answer =
    confirm(
      "Delete this product permanently?"
    );


  if (!answer) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Unable to delete product: " +
      error.message
    );

    return;
  }


  await loadProducts();

}


// ===============================
// LOAD ORDERS
// ===============================

async function loadOrders() {

  const list =
    document.getElementById(
      "ordersList"
    );


  const result =
    await supabaseClient
      .from("orders")
      .select("*");


  if (result.error) {

    console.error(
      result.error
    );

    document.getElementById(
      "ordersCount"
    ).textContent = "0";


    list.innerHTML = `
      <div class="error">
        Unable to load orders.<br><br>
        ${escapeHtml(
          result.error.message
        )}
      </div>
    `;

    return;
  }


  const orders =
    result.data || [];


  document.getElementById(
    "ordersCount"
  ).textContent =
    orders.length;


  if (!orders.length) {

    list.innerHTML = `
      <div class="empty">
        No orders yet.
      </div>
    `;

    return;
  }


  list.innerHTML =
    orders.map(order => `

      <div
        style="
          border:1px solid #ddd;
          padding:20px;
          border-radius:15px;
          margin-bottom:15px;
        "
      >

        <strong>
          Order #${escapeHtml(
            String(order.id)
          )}
        </strong>

        <br><br>

        ${escapeHtml(
          JSON.stringify(order)
        )}

      </div>

    `).join("");

}


// ===============================
// CATEGORY NORMALIZER
// ===============================

function normalizeCategory(category) {

  if (!category) {
    return "T-Shirts";
  }


  const value =
    String(category)
      .trim()
      .toLowerCase();


  if (
    value === "t-shirt" ||
    value === "tshirts" ||
    value === "t-shirts"
  ) {
    return "T-Shirts";
  }


  if (
    value === "baggie jean" ||
    value === "baggie jeans"
  ) {
    return "Baggie Jeans";
  }


  if (value === "hoodie" ||
      value === "hoodies") {
    return "Hoodies";
  }


  return category;
}


// ===============================
// SECURITY HELPERS
// ===============================

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


// START

checkSession();

</script>

</body>
</html>
