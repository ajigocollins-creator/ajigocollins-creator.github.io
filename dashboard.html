<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
    }
    .card-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }
    .card-item input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body class="dashboard-body">

  <div id="login-box" class="login-box" style="margin:80px auto;">
    <h2>CEO Dashboard</h2>
    <p style="color:#666;margin-bottom:16px;">Collins Clothing</p>
    <input id="pass" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p style="margin-top:14px;font-size:13px;color:#888;">Password: collins2026</p>
  </div>

  <div id="app" style="display:none;">
    <header class="dash-header">
      <div><strong>Collins Clothing</strong> — CEO</div>
      <button onclick="logout()" style="background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:6px;">Logout</button>
    </header>

    <div class="dash-container">
      <div class="stats-grid">
        <div class="stat-box"><div class="num" id="t">0</div><div class="label">Total</div></div>
        <div class="stat-box"><div class="num" id="a">0</div><div class="label">Available</div></div>
        <div class="stat-box"><div class="num" id="s">0</div><div class="label">Sold Out</div></div>
        <div class="stat-box"><div class="num" id="o">0</div><div class="label">Orders</div></div>
      </div>

      <div class="dash-card">
        <h2>Add New Product</h2>
        <input type="file" id="img" accept="image/*">
        <img id="prev" style="display:none;width:90px;height:90px;object-fit:cover;border-radius:8px;margin:10px 0;">
        <div class="form-group"><label>Name</label><input id="nname" type="text"></div>
        <div class="form-group"><label>Price (₦)</label><input id="nprice" type="number" value="15000"></div>
        <button class="save-btn" onclick="addP()" style="width:100%;padding:12px;">Add Product</button>
      </div>

      <div class="dash-card">
        <h2>Orders</h2>
        <div id="orders">No orders yet.</div>
      </div>

      <div class="dash-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2>Manage Products</h2>
          <button onclick="resetP()" style="padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:6px;">Reset</button>
        </div>
        <p style="color:#666;font-size:.9rem;">Edit name/price → Save. Tap status to switch Available / Sold Out.</p>
        <div id="plist"></div>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script>
    var imgData = '';

    document.getElementById('loginBtn').onclick = function () {
      if (document.getElementById('pass').value === 'collins2026') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        draw();
      } else {
        alert('Wrong password. Use collins2026');
      }
    };

    document.getElementById('pass').onkeypress = function (e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    };

    function logout() { location.reload(); }

    function draw() {
      var products = getProducts();
      document.getElementById('t').textContent = products.length;
      document.getElementById('a').textContent = products.filter(function (p) { return p.available; }).length;
      document.getElementById('s').textContent = products.filter(function (p) { return !p.available; }).length;
      document.getElementById('o').textContent = getOrders().length;

      var html = '';
      for (var i = 0; i < products.length; i++) {
        var p = products[i];
        html += '<div class="card-item" data-id="' + p.id + '">' +
          '<img src="' + p.image + '">' +
          '<div style="flex:1">' +
            '<input class="en" value="' + p.name.replace(/"/g, '&quot;') + '">' +
            '<input class="ep" type="number" value="' + p.price + '">' +
            '<div class="row-actions">' +
              '<button class="status-toggle ' + (p.available ? 'available' : 'sold') + '" onclick="tog(' + p.id + ')">' + (p.available ? 'Available' : 'Sold Out') + '</button>' +
              '<button class="save-btn" onclick="sav(' + p.id + ')">Save</button>' +
            '</div>' +
          '</div></div>';
      }
      document.getElementById('plist').innerHTML = html;

      var orders = getOrders();
      if (!orders.length) {
        document.getElementById('orders').innerHTML = 'No orders yet.';
      } else {
        var oh = '';
        for (var j = 0; j < orders.length; j++) {
          var x = orders[j];
          oh += '<div class="order-card"><strong>' + x.customer.name + '</strong> • ' + x.customer.phone + '<br>' + formatPrice(x.total) + '</div>';
        }
        document.getElementById('orders').innerHTML = oh;
      }
    }

    function tog(id) {
      var products = getProducts();
      for (var i = 0; i < products.length; i++) {
        if (products[i].id === id) products[i].available = !products[i].available;
      }
      saveProducts(products);
      draw();
    }

    function sav(id) {
      var card = document.querySelector('.card-item[data-id="' + id + '"]');
      var name = card.querySelector('.en').value.trim();
      var price = parseInt(card.querySelector('.ep').value, 10);
      if (!name || isNaN(price)) { alert('Enter name and price'); return; }
      var products = getProducts();
      for (var i = 0; i < products.length; i++) {
        if (products[i].id === id) { products[i].name = name; products[i].price = price; }
      }
      saveProducts(products);
      draw();
      alert('Saved');
    }

    function resetP() {
      if (confirm('Reset products?')) {
        localStorage.removeItem('collins_products');
        draw();
      }
    }

    document.getElementById('img').onchange = function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function (ev) {
        imgData = ev.target.result;
        var p = document.getElementById('prev');
        p.src = imgData;
        p.style.display = 'block';
      };
      r.readAsDataURL(f);
    };

    function addP() {
      var name = document.getElementById('nname').value.trim();
      var price = parseInt(document.getElementById('nprice').value, 10);
      if (!name || !price || !imgData) { alert('Add name, price and photo'); return; }
      var products = getProducts();
      var id = 1;
      for (var i = 0; i < products.length; i++) if (products[i].id >= id) id = products[i].id + 1;
      products.push({ id: id, name: name, brand: 'COLLINS CLOTHING', price: price, image: imgData, available: true });
      saveProducts(products);
      document.getElementById('nname').value = '';
      document.getElementById('nprice').value = '15000';
      document.getElementById('img').value = '';
      document.getElementById('prev').style.display = 'none';
      imgData = '';
      draw();
      alert('Added');
    }
  </script>
</body>
</html>
