<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO Dashboard | Collins Clothing</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .product-card-admin {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .product-card-admin img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .product-card-admin input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .btn-available {
      background: #16a34a;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-sold {
      background: #dc2626;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-save {
      background: #111;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-delete {
      background: #fff;
      color: #dc2626;
      border: 1px solid #dc2626;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body class="dashboard-body">

  <!-- LOGIN -->
  <div id="login-section">
    <div class="login-box">
      <h2 style="margin-bottom:8px;">CEO Dashboard</h2>
      <p style="color:#666;font-size:0.9rem;margin-bottom:20px;">Collins Clothing Admin</p>
      <input type="password" id="password" placeholder="Enter password" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;">
      <button onclick="doLogin()" style="width:100%;padding:14px;background:#111;color:white;border:none;border-radius:8px;font-weight:600;">Login</button>
      <p style="margin-top:14px;font-size:13px;color:#888;">Password: collins2026</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-section" style="display:none;">
    <header class="dash-header">
      <div><strong>Collins Clothing</strong> — CEO Panel</div>
      <button onclick="doLogout()" style="background:#ef4444;color:white;border:none;padding:8px 16px;border-radius:6px;font-weight:600;">Logout</button>
    </header>

    <div class="dash-container">

      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-box"><div class="num" id="stat-total">0</div><div class="label">Total</div></div>
        <div class="stat-box"><div class="num" id="stat-available">0</div><div class="label">Available</div></div>
        <div class="stat-box"><div class="num" id="stat-sold">0</div><div class="label">Sold Out</div></div>
        <div class="stat-box"><div class="num" id="stat-orders">0</div><div class="label">Orders</div></div>
      </div>

      <!-- ADD PRODUCT -->
      <div class="dash-card">
        <h2>Add New Product</h2>
        <input type="file" id="new-image" accept="image/*" onchange="previewImage(event)">
        <img id="preview" style="display:none;width:100px;height:100px;object-fit:cover;border-radius:8px;margin:10px 0;">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="new-name" placeholder="e.g. Steady Grinding Black Tee">
        </div>
        <div class="form-group">
          <label>Price (₦)</label>
          <input type="number" id="new-price" value="15000">
        </div>
        <button onclick="addProduct()" class="btn-save" style="width:100%;padding:12px;margin-top:8px;">Add Product</button>
      </div>

      <!-- PRODUCTS LIST -->
      <div class="dash-card">
        <h2>Manage Products</h2>
        <p style="color:#666;font-size:0.9rem;margin-bottom:16px;">
          Edit name or price → Save. Toggle Available/Sold. Delete unwanted items.
        </p>
        <div id="product-list"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== PASTE YOUR KEYS HERE ==========
    const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
    // ==========================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let newImageData = "";

    // Login
    function doLogin() {
      const pass = document.getElementById("password").value;
      if (pass === "collins2026") {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("dash-section").style.display = "block";
        loadProducts();
      } else {
        alert("Wrong password");
      }
    }

    function doLogout() {
      location.reload();
    }

    // Load products from Supabase
    async function loadProducts() {
      const { data, error } = await supabase.from("products").select("*").order("id");
      if (error) {
        alert("Error loading products: " + error.message);
        return;
      }

      const products = data || [];
      document.getElementById("stat-total").textContent = products.length;
      document.getElementById("stat-available").textContent = products.filter(p => p.available).length;
      document.getElementById("stat-sold").textContent = products.filter(p => !p.available).length;

      const list = document.getElementById("product-list");
      list.innerHTML = products.map(p => `
        <div class="product-card-admin" data-id="${p.id}">
          <img src="${p.image || 'logo.png'}" alt="">
          <div style="flex:1;">
            <input class="edit-name" value="${p.name || ''}" placeholder="Product name">
            <input class="edit-price" type="number" value="${p.price || 0}">
            <div class="admin-actions">
              <button class="\( {p.available ? 'btn-available' : 'btn-sold'}" onclick="toggleStatus( \){p.id}, ${!p.available})">
                ${p.available ? 'Available' : 'Sold Out'}
              </button>
              <button class="btn-save" onclick="saveProduct(${p.id})">Save</button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    // Toggle Available / Sold Out
    async function toggleStatus(id, newStatus) {
      const { error } = await supabase
        .from("products")
        .update({ available: newStatus })
        .eq("id", id);

      if (error) {
        alert("Error: " + error.message);
        return;
      }
      loadProducts();
    }

    // Save name & price
    async function saveProduct(id) {
      const card = document.querySelector(`.product-card-admin[data-id="${id}"]`);
      const name = card.querySelector(".edit-name").value.trim();
      const price = parseInt(card.querySelector(".edit-price").value, 10);

      if (!name || isNaN(price)) {
        alert("Enter valid name and price");
        return;
      }

      const { error } = await supabase
        .from("products")
        .update({ name, price })
        .eq("id", id);

      if (error) {
        alert("Error: " + error.message);
        return;
      }
      alert("Saved!");
      loadProducts();
    }

    // Delete product
    async function deleteProduct(id) {
      if (!confirm("Delete this product permanently?")) return;

      const { error } = await supabase
        .from("products")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Error: " + error.message);
        return;
      }
      loadProducts();
    }

    // Preview image
    function previewImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        newImageData = ev.target.result;
        const prev = document.getElementById("preview");
        prev.src = newImageData;
        prev.style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    // Add new product
    async function addProduct() {
      const name = document.getElementById("new-name").value.trim();
      const price = parseInt(document.getElementById("new-price").value, 10);

      if (!name || !price) {
        alert("Enter name and price");
        return;
      }
      if (!newImageData) {
        alert("Please choose a photo");
        return;
      }

      const { error } = await supabase.from("products").insert({
        name: name,
        brand: "COLLINS CLOTHING",
        price: price,
        image: newImageData,
        available: true
      });

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      document.getElementById("new-name").value = "";
      document.getElementById("new-price").value = "15000";
      document.getElementById("new-image").value = "";
      document.getElementById("preview").style.display = "none";
      newImageData = "";
      loadProducts();
      alert("Product added!");
    }

    // Allow Enter key on login
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
  </html>
